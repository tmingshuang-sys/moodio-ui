name = "moodio-gateway"
main = "worker.js"
compatibility_date = "2026-06-01"

# 自定义域名：workers.dev 在国内被 DNS 污染 + 按 SNI 掐 TLS，必须挂代理才能连，而且时断时续；
# moodio.art 托在 Cloudflare 且没有被污染，直连就通。老的 workers.dev 地址继续可用，不影响旧配置。
# 自定义域名（现在还绑不上，先留着）：workers.dev 在国内被 DNS 污染并按 SNI 掐 TLS，不挂代理连不上、
# 挂了也时断时续。moodio.art 托在 Cloudflare 且没被污染，直连就通，所以网关应该绑过去。
# 卡在哪：moodio.art 的 zone 不在当前部署用的那个 Cloudflare 账号（tmingshuang@gmail.com /
# 8c5f52bdea253c19925cd69a4458daf0）下，deploy 会报 10083 zone does not exist。
# 等 zone 和 Worker 在同一个账号下之后，去掉下面两行的注释再 deploy 就行（DNS 记录 wrangler 自己建）。
# routes = [
#   { pattern = "gw.moodio.art", zone_name = "moodio.art", custom_domain = true },
# ]

[vars]
UPSTREAM_BASE = "https://api.deepseek.com/v1"
# 部署后把页面网址填进来，逗号分隔；留空 = 允许任何来源
ALLOWED_ORIGINS = "https://wow.moodio.art,https://moodio-ui.moodio-ui.workers.dev,http://127.0.0.1:8765,http://localhost:8765,http://localhost:5174"

# 密钥不写在这里，用命令设置：
#   npx wrangler secret put DEEPSEEK_API_KEY
#   npx wrangler secret put KIMI_API_KEY      # Moonshot（Kimi K3，支持看图）
#   npx wrangler secret put BYTEPLUS_API_KEY  # BytePlus ModelArk（海外版方舟，Seedance 2.5）
#   npx wrangler secret put ACCESS_TOKEN
